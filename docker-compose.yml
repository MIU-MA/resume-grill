services:
  resume-grill:
    build:
      context: .
    image: resume-grill:latest
    container_name: resume-grill
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 运行时环境变量（推荐在这里配置模型）
      # 三者都填则服务端直接用此 Key；任一缺失则回落到前端设置页填写的配置
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # 自建模型/内网端点白名单（如需访问 Ollama 等本机地址）
      # ALLOWED_LLM_BASE_URLS: http://127.0.0.1:11434
    # volumes:
    #   - ./data:/data   # 如需持久化额外数据
