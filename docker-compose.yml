services:
  resume-grill:
    build:
      context: .
    image: resume-grill:latest
    container_name: resume-grill
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 运行时服务端默认模型配置
      # 完整的网页配置优先；未提供时回退到此处完整的三个变量
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # 自建模型/内网端点白名单（如需访问 Ollama 等本机地址）
      # ALLOWED_LLM_BASE_URLS: http://127.0.0.1:11434
    # volumes:
    #   - ./data:/data   # 如需持久化额外数据
