<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSS 岗位与投递预览 · Resume Grill</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#28323d;background:#f5f6f7;font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:18px 28px;background:white;border-bottom:1px solid #dfe2e5;display:flex;align-items:center;gap:20px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}small,.meta{font-size:12px;color:#727c87}button,input,textarea,select{font:inherit;border:1px solid #cfd5dc;background:white;color:inherit;padding:8px 10px;border-radius:0}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}.primary{background:#303a46;border-color:#303a46;color:white}.badge{padding:3px 9px;background:#fff4dc;color:#865f1d;font-size:12px}main{max-width:1600px;margin:auto;padding:22px 28px}.connection{background:white;border:1px solid #dfe2e5;padding:14px 18px;margin-bottom:18px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#tabs{min-width:220px;max-width:420px;flex:1}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px}.panel{background:white;border:1px solid #dfe2e5;padding:20px}.field{display:block;margin-bottom:16px}.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field textarea{width:100%}textarea{resize:vertical;font-size:14px;line-height:1.65}.field textarea{min-height:180px}p{margin:8px 0}.error{color:#b33e32;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.job,.draft{padding:16px 0;border-bottom:1px solid #e5e7ea}.job label{display:flex;gap:10px;align-items:flex-start}.job strong{display:block}.draft h3{font-size:16px;margin:0}.draft textarea{width:100%;min-height:110px;margin:10px 0}.pictures{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.picture{width:110px}.picture img{display:block;width:110px;height:145px;object-fit:contain;border:1px solid #e0e3e7;background:#fafafa}.picture small{display:block;overflow-wrap:anywhere}details{margin-top:16px}summary{cursor:pointer;font-size:13px}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}#empty{padding:60px 10px;text-align:center;color:#79838f}.preview iframe{width:100%;height:650px;border:1px solid #d9dfe5;background:white;margin-top:12px}.preview{margin-top:18px}.viewer{height:100vh;background:#e8e9e7;display:flex;flex-direction:column}.toolbar{padding:8px;background:white;display:flex;align-items:center;gap:8px}.toolbar input{flex:1;min-width:80px}#remoteControls{display:flex;gap:8px;flex:1}.screen{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center}canvas{width:100%;height:auto;outline:none;touch-action:none}#remote{display:none}[hidden]{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column;gap:6px}main{padding:16px}.preview iframe{height:500px}}
</style>
<section id="shell">
<header><h1>BOSS 岗位与投递预览</h1><span class="badge">本轮不发送</span><small>拉取岗位 → 按方向筛选 → 准备招呼语与简历图片</small></header>
<main>
<section class="connection"><div class="row" id="attachControls"><button id="connect">连接 Chrome</button><button id="disconnect" disabled>断开</button><select id="tabs" aria-label="BOSS 标签页"></select><button id="refreshTabs">刷新列表</button><button id="selectTab" disabled>选择页面</button></div><p class="meta" id="status">尚未连接浏览器</p><p class="meta" id="tabHint">在 Chrome 保留登录后的岗位结果页，再连接并选择页面。</p><p class="error" id="error" role="status"></p></section>
<div class="layout">
<aside class="panel"><h2>投递资料</h2>
<label class="field"><span>岗位方向</span><input id="target" placeholder="例如：全栈、数据分析" maxlength="120"></label>
<label class="field"><span>已有简历中的相关经历</span><textarea id="resume" placeholder="粘贴原简历中的经历，招呼语只引用这里的内容，不补写没有的技能。" maxlength="30000"></textarea></label>
<label class="field"><span>简历图片 · PNG / JPG</span><input id="images" type="file" accept="image/png,image/jpeg" multiple><small>最多 3 张，单张不超过 5 MB，合计不超过 10 MB。只在本机预览。</small></label><div id="imageList" class="pictures"></div>
<details><summary>自定义招呼语</summary><label class="field"><textarea id="template" style="min-height:90px" maxlength="600" placeholder="可用 {公司}、{岗位}、{经历}；留空使用默认文本。"></textarea></label></details>
<div class="actions"><button id="search" disabled>官网搜索</button><button id="prepare" class="primary" disabled>拉取并准备</button><button id="read" disabled>只读取岗位</button></div>
<p class="meta">当前生成待发送内容，不点击官网的沟通或发送按钮。</p>
</aside>
<section class="panel"><div class="row" style="justify-content:space-between"><h2>岗位与待发送内容</h2><button id="changeSelection" hidden>调整岗位选择</button><button disabled title="实发尚未接入">发送招呼语与图片</button></div><p id="hint" class="meta">选择页面后，可先读取岗位，也可一次拉取并准备。</p><div id="empty">岗位、招呼语和对应图片会显示在这里。</div><div id="jobs"></div><div id="drafts"></div><details id="skips" hidden><summary id="skipSummary"></summary><div id="skipList" class="meta"></div></details></section>
</div>
<details class="preview panel" id="preview"><summary>查看页面截图 · 手动更新</summary><p class="meta">现有浏览器模式只读取画面，不刷新官网、不转发键鼠。</p><iframe title="所选页面画面" hidden></iframe></details>
<details class="panel"><summary>连接诊断</summary><pre id="diagnostic"></pre></details>
</main></section>
<section id="remote" class="viewer"><div class="toolbar"><div id="remoteControls"><small>点击画面操作</small><input id="typing" aria-label="输入到浏览器" placeholder="写入到当前焦点"><button id="insert">写入</button></div><button id="refreshShot">更新截图</button><span id="connection"></span></div><div class="screen"><canvas id="canvas" tabindex="0" width="1280" height="800" aria-label="所选浏览器页面"></canvas></div><small class="error" id="inputError" role="status"></small></section>
<script>
const token='__SESSION_TOKEN__',readOnly=__READ_ONLY__;
const $=id=>document.getElementById(id);
async function api(path,body){const response=await fetch(path,{headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{method:'POST',body:JSON.stringify(body)}:{})});if(!response.ok){const data=await response.json();throw new Error(data.error||'请求失败')}return response}
if(location.pathname==='/view'){
 $('shell').remove();$('remote').style.display='flex';$('remoteControls').hidden=readOnly;
 const canvas=$('canvas'),ctx=canvas.getContext('2d');let stopped=false,remoteWidth=1280,remoteHeight=800,inputQueue=Promise.resolve();
 const send=command=>{const operation=inputQueue.then(async()=>{try{await api('/input',command);$('inputError').textContent='';return true}catch(error){$('inputError').textContent=error.message;return false}});inputQueue=operation;return operation};
 const point=event=>{const rect=canvas.getBoundingClientRect();return{x:(event.clientX-rect.left)*remoteWidth/rect.width,y:(event.clientY-rect.top)*remoteHeight/rect.height}};
 if(!readOnly){
  canvas.addEventListener('click',event=>{canvas.focus();void send({type:'click',...point(event)})});
  canvas.addEventListener('wheel',event=>{event.preventDefault();void send({type:'wheel',...point(event),delta:Math.max(-1200,Math.min(1200,event.deltaY*(event.deltaMode===1?20:1)))})},{passive:false});
  canvas.addEventListener('keydown',event=>{if(event.ctrlKey||event.metaKey||event.altKey)return;if(['Enter','Backspace','Delete','Tab','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key)){event.preventDefault();void send({type:'key',key:event.key})}else if(event.key.length===1&&!event.isComposing){event.preventDefault();void send({type:'text',text:event.key})}});
 }
 $('insert').onclick=async()=>{if($('typing').value&&await send({type:'text',text:$('typing').value})){$('typing').value='';canvas.focus()}};
 async function refresh(){if(stopped)return;try{const response=await api('/frame'),bitmap=await createImageBitmap(await response.blob());remoteWidth=Number(response.headers.get('X-Viewport-Width'))||1280;remoteHeight=Number(response.headers.get('X-Viewport-Height'))||800;if(canvas.width!==bitmap.width||canvas.height!==bitmap.height){canvas.width=bitmap.width;canvas.height=bitmap.height}ctx.drawImage(bitmap,0,0);bitmap.close();$('connection').textContent=readOnly?'截图已更新':'已连接'}catch(error){$('connection').textContent=error.message}if(!readOnly)setTimeout(refresh,500)}
 $('refreshShot').onclick=async()=>{try{await api('/capture',{});await refresh()}catch(error){$('inputError').textContent=error.message}};
 addEventListener('pagehide',()=>{stopped=true});void refresh();
}else{
 $('remote').remove();const frame=document.querySelector('iframe');let tabsKey='',actionError='',polling=false,ready=false,busy=false,imagesLoading=false,images=[],version=0,imageVersion=0;
 const phases={disconnected:'尚未连接浏览器。', 'awaiting-permission':'等待 Chrome 授权，请在浏览器中手动确认。',selecting:'Chrome 已连接，请选择岗位结果页。',preparing:'正在读取页面…',closed:'所选页面已关闭，请断开后重新连接。',error:'采集已暂停，请查看提示。'};
 function updateButtons(){for(const id of ['read','prepare','search'])$(id).disabled=!ready||busy||imagesLoading}
 function changed(){version++;if($('drafts').childElementCount)$('hint').textContent='资料已修改，请重新准备，现有草稿不会自动发送。'}
 for(const id of ['target','resume','template'])$(id).addEventListener('input',changed);
 function pictureList(target,entries){for(const item of entries){const figure=document.createElement('div');figure.className='picture';const img=document.createElement('img');img.src=item.url;img.alt=item.meta.name;const name=document.createElement('small');name.textContent=item.meta.name;figure.append(img,name);target.append(figure)}}
 $('images').onchange=async()=>{
  const current=++imageVersion;changed();images.forEach(item=>URL.revokeObjectURL(item.url));images=[];$('imageList').replaceChildren();imagesLoading=true;updateButtons();const next=[];
  try{const files=[...$('images').files];if(files.length>3||files.reduce((n,f)=>n+f.size,0)>10*1024*1024)throw new Error('最多选择 3 张图片，合计不超过 10 MB');
   for(const file of files){if(!['image/png','image/jpeg'].includes(file.type)||file.size>5*1024*1024)throw new Error('请选择不超过 5 MB 的 PNG 或 JPG 图片');const bytes=await file.arrayBuffer(),head=new Uint8Array(bytes);const valid=file.type==='image/png'?[137,80,78,71,13,10,26,10].every((v,i)=>head[i]===v):head[0]===255&&head[1]===216&&head[2]===255;if(!valid)throw new Error('图片格式与文件内容不一致');const bitmap=await createImageBitmap(file);const width=bitmap.width,height=bitmap.height;bitmap.close();if(width>20000||height>20000)throw new Error('图片尺寸过大');const sha256=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');next.push({url:URL.createObjectURL(file),meta:{name:file.name,type:file.type,size:file.size,width,height,sha256}})}
   if(current!==imageVersion){next.forEach(item=>URL.revokeObjectURL(item.url));return}images.forEach(item=>URL.revokeObjectURL(item.url));images=next;$('imageList').replaceChildren();pictureList($('imageList'),images);actionError='';
  }catch(error){next.forEach(item=>URL.revokeObjectURL(item.url));if(current===imageVersion){actionError=error.message;$('error').textContent=actionError}}finally{if(current===imageVersion){imagesLoading=false;updateButtons()}}
 };
 async function status(){if(polling)return;polling=true;try{const data=await(await api('/status')).json();ready=data.ready;$('status').textContent=data.ready?'已选择 '+data.url+' · 可读取当前岗位':phases[data.phase]||'正在连接…';$('diagnostic').textContent=JSON.stringify(data,null,2);$('error').textContent=data.error||actionError;$('attachControls').hidden=data.mode!=='existing';$('connect').disabled=data.browserConnected||data.phase==='awaiting-permission';$('disconnect').disabled=!data.browserConnected||data.phase==='preparing';const key=JSON.stringify(data.tabs);if(key!==tabsKey){const previous=$('tabs').value;$('tabs').replaceChildren();for(const tab of data.tabs){const option=document.createElement('option');option.value=tab.id;option.textContent=tab.title||tab.url;$('tabs').append(option)}if(data.tabs.some(tab=>tab.id===previous))$('tabs').value=previous;tabsKey=key}$('selectTab').disabled=data.phase!=='selecting'||!data.tabs.length;$('tabHint').textContent=data.browserConnected?(data.tabs.length?'找到 '+data.tabs.length+' 个 BOSS 页面，连接不会刷新官网。':'没有找到 BOSS 页面。请在 Chrome 打开官网，再刷新列表。'):'在 Chrome 保留登录后的岗位结果页，再连接并选择页面。';if(!ready&&frame.hasAttribute('src')){frame.removeAttribute('src');frame.hidden=true}updateButtons()}catch(error){$('status').textContent='验证服务未连接：'+error.message}finally{polling=false}}
 async function run(path,body){actionError='';try{await api(path,body)}catch(error){actionError=error.message;$('error').textContent=actionError}await status()}
 $('connect').onclick=()=>run('/connect',{});$('disconnect').onclick=()=>run('/disconnect',{});$('selectTab').onclick=()=>run('/select',{id:$('tabs').value});$('refreshTabs').onclick=()=>status();
 $('preview').addEventListener('toggle',async()=>{if(!$('preview').open||!ready)return;try{await api('/capture',{});frame.hidden=false;frame.src='/view'}catch(error){actionError=error.message;$('error').textContent=actionError}});
 async function readJobs(){const previous=new Map([...$('jobs').querySelectorAll('input')].map(input=>[input.value,input.checked]));const data=await(await api('/jobs')).json();$('jobs').replaceChildren();$('jobs').hidden=false;$('changeSelection').hidden=true;$('drafts').replaceChildren();$('skips').hidden=true;$('empty').hidden=!!data.jobs.length;$('hint').textContent=data.jobs.length?'读到 '+data.jobs.length+' 个岗位，可取消不想联系的岗位。':data.message;for(const job of data.jobs){const row=document.createElement('div');row.className='job';const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.value=job.url;check.checked=previous.get(job.url)??true;check.addEventListener('change',changed);const info=document.createElement('div'),title=document.createElement('strong'),meta=document.createElement('small');title.textContent=job.title;meta.textContent=[job.company,job.salary].filter(Boolean).join(' · ');info.append(title,meta);label.append(check,info);row.append(label);$('jobs').append(row)}return data}
 function renderDrafts(result){$('jobs').hidden=true;$('changeSelection').hidden=false;$('drafts').replaceChildren();$('empty').hidden=!!result.prepared.length;$('hint').textContent='已准备 '+result.prepared.length+' 个岗位 · 已发送 0。招呼语可逐条修改。';for(const item of result.prepared){const article=document.createElement('article');article.className='draft';const title=document.createElement('h3');title.textContent=[item.company,item.title].filter(Boolean).join(' · ');const checks=document.createElement('p');checks.className='meta';checks.textContent=item.checks.join('；');const area=document.createElement('textarea');area.value=item.greeting;area.maxLength=1000;area.setAttribute('aria-label',item.title+'的招呼语');const copy=document.createElement('button');copy.textContent='复制招呼语';copy.onclick=async()=>{try{await navigator.clipboard.writeText(area.value);copy.textContent='已复制'}catch{copy.textContent='请选中文字复制'}};article.append(title,checks,area,copy);if(item.evidence){const detail=document.createElement('details'),summary=document.createElement('summary'),quote=document.createElement('p');summary.textContent='查看简历依据';quote.textContent=item.evidence;detail.append(summary,quote);article.append(detail)}const pics=document.createElement('div');pics.className='pictures';pictureList(pics,images);article.append(pics);$('drafts').append(article)}$('skips').hidden=!result.skipped.length;$('skipSummary').textContent='跳过 '+result.skipped.length+' 个岗位';$('skipList').replaceChildren();for(const item of result.skipped){const line=document.createElement('p');line.textContent=item.title+' · '+item.reason;$('skipList').append(line)}}
 async function work(prepare){if(busy)return;busy=true;updateButtons();actionError='';const current=version;try{if(prepare&&(!$('target').value.trim()||$('resume').value.trim().length<10))throw new Error('请填写岗位方向，并提供已有简历中的相关经历');const input={target:$('target').value,resumeText:$('resume').value,greetingTemplate:$('template').value,images:images.map(item=>item.meta)};const data=await readJobs();if(prepare){if(!data.jobs.length)throw new Error('没有读取到岗位，暂不能准备投递内容');const selectedUrls=[...$('jobs').querySelectorAll('input:checked')].map(item=>item.value);if(!selectedUrls.length)throw new Error('请至少选择一个岗位');const result=await(await api('/prepare',{...input,readId:data.readId,selectedUrls})).json();if(version!==current)throw new Error('资料已修改，请重新准备');renderDrafts(result)}}catch(error){actionError=error.message;$('error').textContent=actionError}finally{busy=false;updateButtons()}}
 $('changeSelection').onclick=()=>{$('jobs').hidden=false;$('drafts').replaceChildren();$('skips').hidden=true;$('changeSelection').hidden=true;$('hint').textContent='调整勾选后重新准备。'};
 $('search').onclick=async()=>{if(!$('target').value.trim()){actionError='请先填写岗位方向';$('error').textContent=actionError;return}await run('/search',{query:$('target').value});$('jobs').replaceChildren();$('drafts').replaceChildren();$('hint').textContent='已打开官网搜索；页面加载完成后点“拉取并准备”。'};
 $('read').onclick=()=>work(false);$('prepare').onclick=()=>work(true);addEventListener('pagehide',()=>images.forEach(item=>URL.revokeObjectURL(item.url)));void status();setInterval(status,2000);
}
</script>
</html>
